<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4" th:text="${expense.id == null} ? 'Nova Despesa' : 'Editar Despesa'">Formulário de Despesa</h2>

        <form th:action="@{/expenses/save}" th:object="${expense}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="date" class="form-label">Data de Registro</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="dueDate" class="form-label">Data de Vencimento</label>
                    <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="category" class="form-label">Categoria</label>
                    <select class="form-select" id="category" th:field="*{category}" required>
                        <option value="">Selecione...</option>
                        <option th:each="c : ${T(com.sistema.sicaf.model.ExpenseCategory).values()}"
                                th:value="${c}" th:text="${c.displayName}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descrição</label>
                <input type="text" class="form-control" id="description" th:field="*{description}" required>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Valor (R$)</label>
                <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/expenses}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
