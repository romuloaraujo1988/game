<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Registrar Trato (Fornecimento)</h2>

        <form th:action="@{/feed/distribution/save}" th:object="${distribution}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Data</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="pasture" class="form-label">Pasto (Destino)</label>
                    <select class="form-select" id="pasture" th:field="*{pasture}" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${pastures}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="formula" class="form-label">Fórmula (Ração)</label>
                    <select class="form-select" id="formula" th:field="*{formula}" required>
                        <option value="">Selecione...</option>
                        <option th:each="f : ${formulas}" th:value="${f.id}" th:text="${f.name}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="quantityKg" class="form-label">Quantidade Fornecida (Kg)</label>
                    <input type="number" step="0.01" class="form-control" id="quantityKg" th:field="*{quantityKg}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="observations" class="form-label">Observações</label>
                <input type="text" class="form-control" id="observations" th:field="*{observations}">
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/feed/distribution}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
