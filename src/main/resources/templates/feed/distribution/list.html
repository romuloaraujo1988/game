<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Fornecimento de Ração (Trato)</h2>
            <a th:href="@{/feed/distribution/new}" class="btn btn-primary">Registrar Trato</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Pasto</th>
                    <th>Fórmula</th>
                    <th>Quantidade (Kg)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${distributions}">
                    <td th:text="${d.date}">Data</td>
                    <td th:text="${d.pasture.name}">Pasto</td>
                    <td th:text="${d.formula.name}">Fórmula</td>
                    <td th:text="${d.quantityKg}">0.0</td>
                    <td>
                        <a th:href="@{/feed/distribution/delete/{id}(id=${d.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir registro?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(distributions)}">
                    <td colspan="5" class="text-center">Nenhum fornecimento registrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
