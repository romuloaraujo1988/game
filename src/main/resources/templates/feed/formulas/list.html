<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Fórmulas de Ração</h2>
            <a th:href="@{/feed/formulas/new}" class="btn btn-primary">Nova Fórmula</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Qtd Insumos</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${formulas}">
                    <td th:text="${f.name}">Nome</td>
                    <td th:text="${f.description}">Desc</td>
                    <td th:text="${#lists.size(f.items)}">0</td>
                    <td>
                        <a th:href="@{/feed/formulas/edit/{id}(id=${f.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/feed/formulas/delete/{id}(id=${f.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir fórmula?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(formulas)}">
                    <td colspan="4" class="text-center">Nenhuma fórmula cadastrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
