<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4" th:text="${input.id == null} ? 'Novo Insumo' : 'Editar Insumo'">Formulário</h2>

        <form th:action="@{/feed/inputs/save}" th:object="${input}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="name" class="form-label">Nome do Insumo</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Ex: Milho Moído">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="stock" class="form-label">Estoque Inicial (Kg)</label>
                    <input type="number" step="0.001" class="form-control" id="stock" th:field="*{stockQuantityKg}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cost" class="form-label">Custo Unitário (R$/Kg)</label>
                    <input type="number" step="0.01" class="form-control" id="cost" th:field="*{unitCostPerKg}" required>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/feed/inputs}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
