<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Registrar Produção</h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/feed/production/save}" th:object="${production}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Data</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="formula" class="form-label">Fórmula (Receita)</label>
                    <select class="form-select" id="formula" th:field="*{formula}" required>
                        <option value="">Selecione...</option>
                        <option th:each="f : ${formulas}" th:value="${f.id}" th:text="${f.name}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="totalQuantityKg" class="form-label">Quantidade Total a Produzir (Kg)</label>
                <input type="number" step="0.01" class="form-control" id="totalQuantityKg" th:field="*{totalQuantityKg}" required>
                <div class="form-text">O sistema irá descontar os insumos automaticamente do estoque.</div>
            </div>

            <div class="mb-3">
                <label for="observations" class="form-label">Observações</label>
                <input type="text" class="form-control" id="observations" th:field="*{observations}">
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Confirmar Produção</button>
                <a th:href="@{/feed/production}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
