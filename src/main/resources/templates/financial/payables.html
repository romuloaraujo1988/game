<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Contas a Pagar (Despesas Pendentes)</h2>
            <a th:href="@{/expenses/new}" class="btn btn-primary">Nova Despesa</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Vencimento</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${expenses}">
                    <td th:text="${e.dueDate != null} ? ${e.dueDate} : 'Sem Vencimento'">Data</td>
                    <td th:text="${e.description}">Desc</td>
                    <td th:text="'R$ ' + ${e.amount}" class="text-danger fw-bold">Valor</td>
                    <td>
                        <a th:href="@{/financial/pay/{id}(id=${e.id})}" class="btn btn-sm btn-success" onclick="return confirm('Confirmar pagamento desta conta?');">Dar Baixa (Pagar)</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(expenses)}">
                    <td colspan="4" class="text-center">Nenhuma conta pendente.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
