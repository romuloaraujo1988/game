<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Contas a Receber (Vendas Pendentes)</h2>
            <a th:href="@{/sales/new}" class="btn btn-primary">Nova Venda</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Vencimento</th>
                    <th>Comprador</th>
                    <th>Valor Total</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${sales}">
                    <td th:text="${s.dueDate != null} ? ${s.dueDate} : 'Sem Vencimento'">Data</td>
                    <td th:text="${s.buyerName}">Comprador</td>
                    <td th:text="'R$ ' + ${s.totalAmount}" class="text-success fw-bold">Valor</td>
                    <td>
                        <a th:href="@{/financial/receive/{id}(id=${s.id})}" class="btn btn-sm btn-success" onclick="return confirm('Confirmar recebimento?');">Dar Baixa (Receber)</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sales)}">
                    <td colspan="4" class="text-center">Nenhum recebimento pendente.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
