<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Registrar Movimentação - <span th:text="${animal.earTag}">Brinco</span></h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/movements/save}" th:object="${movement}" method="post">
            <input type="hidden" name="animal" th:value="${animal.id}" />
            <input type="hidden" name="originPasture" th:value="${movement.originPasture != null ? movement.originPasture.id : ''}" />

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Pasto Atual (Origem)</label>
                    <input type="text" class="form-control"
                           th:value="${movement.originPasture != null ? movement.originPasture.name : 'Nenhum'}" disabled>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Data da Movimentação</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="destinationPasture" class="form-label">Pasto de Destino</label>
                    <select class="form-select" id="destinationPasture" th:field="*{destinationPasture}" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${pastures}"
                                th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="reason" class="form-label">Motivo</label>
                <input type="text" class="form-control" id="reason" th:field="*{reason}">
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar e Atualizar Animal</button>
                <a th:href="@{/animals}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
