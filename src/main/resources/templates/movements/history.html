<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Histórico de Movimentação - <span th:text="${animal.earTag}">Brinco</span></h2>
            <div>
                <a th:href="@{/movements/new/{id}(id=${animal.id})}" class="btn btn-primary">Nova Movimentação</a>
                <a th:href="@{/animals}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Origem</th>
                    <th>Destino</th>
                    <th>Motivo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${movements}">
                    <td th:text="${m.date}">Data</td>
                    <td th:text="${m.originPasture != null} ? ${m.originPasture.name} : 'Origem Desconhecida'">Origem</td>
                    <td th:text="${m.destinationPasture.name}">Destino</td>
                    <td th:text="${m.reason}">Motivo</td>
                </tr>
                <tr th:if="${#lists.isEmpty(movements)}">
                    <td colspan="4" class="text-center">Nenhuma movimentação registrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
