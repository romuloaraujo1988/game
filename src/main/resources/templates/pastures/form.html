<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4" th:text="${pasture.id == null} ? 'Novo Pasto' : 'Editar Pasto'">Formulário de Pasto</h2>

        <form th:action="@{/pastures/save}" th:object="${pasture}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="name" class="form-label">Nome do Pasto</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro</div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="area" class="form-label">Área (Hectares)</label>
                    <input type="number" step="0.01" class="form-control" id="area" th:field="*{areaInHectares}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="capacity" class="form-label">Capacidade Máxima (Animais)</label>
                    <input type="number" class="form-control" id="capacity" th:field="*{capacity}">
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/pastures}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
