<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventário de Rebanho - SICAF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; font-family: 'Times New Roman', Times, serif; }
        @media print {
            .no-print { display: none; }
            body { padding: 0; }
        }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .pasture-section { margin-bottom: 25px; page-break-inside: avoid; }
        .pasture-header { background-color: #f0f0f0; padding: 5px 10px; font-weight: bold; border: 1px solid #ddd; }
        .table-sm td, .table-sm th { padding: 0.25rem; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="no-print mb-4">
        <button onclick="window.print()" class="btn btn-primary">Imprimir</button>
        <button onclick="window.close()" class="btn btn-secondary">Fechar</button>
    </div>

    <div class="header">
        <h1>SICAF - Inventário de Rebanho</h1>
        <p>
            Gerado em: <span th:text="${#temporals.format(generationDate, 'dd/MM/yyyy HH:mm')}">Data</span> |
            Total de Animais: <strong th:text="${totalAnimals}">0</strong>
        </p>
    </div>

    <div th:each="entry : ${animalsByPasture}" class="pasture-section">
        <div class="pasture-header d-flex justify-content-between">
            <span th:text="${entry.key}">Nome do Pasto</span>
            <span th:text="'Qtd: ' + ${#lists.size(entry.value)}">Qtd</span>
        </div>
        <table class="table table-bordered table-sm mb-0">
            <thead>
                <tr>
                    <th style="width: 15%">Brinco</th>
                    <th style="width: 20%">Raça</th>
                    <th style="width: 15%">Sexo</th>
                    <th style="width: 20%">Nascimento</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="animal : ${entry.value}">
                    <td th:text="${animal.earTag}">Brinco</td>
                    <td th:text="${animal.breed}">Raça</td>
                    <td th:text="${animal.gender}">Sexo</td>
                    <td th:text="${animal.birthDate}">Data</td>
                    <td th:text="${animal.status}">Status</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalAnimals == 0}" class="alert alert-info text-center">
        Nenhum animal ativo encontrado no rebanho.
    </div>

</body>
</html>
