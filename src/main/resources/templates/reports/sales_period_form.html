<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Relatório de Vendas por Período</h2>

        <div class="card card-body" style="max-width: 500px; margin: 0 auto;">
            <form th:action="@{/reports/sales-period/result}" method="get" target="_blank">
                <div class="mb-3">
                    <label for="startDate" class="form-label">Data Inicial</label>
                    <input type="date" class="form-control" id="startDate" name="startDate" required>
                </div>
                <div class="mb-3">
                    <label for="endDate" class="form-label">Data Final</label>
                    <input type="date" class="form-control" id="endDate" name="endDate" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Gerar Relatório</button>
            </form>
            <div class="mt-3 text-center">
                <a th:href="@{/reports}">Voltar</a>
            </div>
        </div>
    </div>
</body>
</html>
