<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Histórico Reprodutivo - <span th:text="${animal.earTag}">Brinco</span></h2>
            <div>
                <a th:href="@{/reproductions/new/{id}(id=${animal.id})}" class="btn btn-primary">Novo Evento</a>
                <a th:href="@{/animals}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Observações</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reproductions}">
                    <td th:text="${r.date}">Data</td>
                    <td th:text="${r.type}">Tipo</td>
                    <td th:text="${r.observations}">Obs</td>
                    <td>
                        <a th:href="@{/reproductions/delete/{id}(id=${r.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir evento?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reproductions)}">
                    <td colspan="4" class="text-center">Nenhum evento registrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
