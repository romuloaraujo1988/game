<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Nova Venda</h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/sales/save}" th:object="${sale}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Data da Venda</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="buyerName" class="form-label">Comprador</label>
                    <input type="text" class="form-control" id="buyerName" th:field="*{buyerName}" required>
                </div>
            </div>

            <h4 class="mt-4 mb-3">Selecionar Animais</h4>
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th style="width: 50px;">Sel.</th>
                            <th>Brinco</th>
                            <th>Raça</th>
                            <th>Preço (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="animal : ${activeAnimals}">
                            <td class="text-center">
                                <input type="checkbox" name="animalIds" th:value="${animal.id}" class="form-check-input animal-check">
                            </td>
                            <td th:text="${animal.earTag}">Brinco</td>
                            <td th:text="${animal.breed}">Raça</td>
                            <td>
                                <input type="number" step="0.01" name="prices" class="form-control price-input" disabled required>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(activeAnimals)}">
                            <td colspan="4" class="text-center">Nenhum animal ativo disponível para venda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success" th:if="${!#lists.isEmpty(activeAnimals)}">Finalizar Venda</button>
                <a th:href="@{/sales}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>

        <script>
            // Simple script to enable price input only when checkbox is checked
            document.querySelectorAll('.animal-check').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const row = this.closest('tr');
                    const input = row.querySelector('.price-input');
                    input.disabled = !this.checked;
                    if (!this.checked) input.value = '';
                });
            });
        </script>
    </div>
</body>
</html>
