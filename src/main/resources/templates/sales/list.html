<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestão de Vendas</h2>
            <a th:href="@{/sales/new}" class="btn btn-primary">Nova Venda</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Comprador</th>
                    <th>Valor Total</th>
                    <th>Qtd. Animais</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sale : ${sales}">
                    <td th:text="${sale.date}">Data</td>
                    <td th:text="${sale.buyerName}">Comprador</td>
                    <td th:text="'R$ ' + ${sale.totalAmount}">Valor</td>
                    <td th:text="${#lists.size(sale.items)}">Qtd</td>
                </tr>
                <tr th:if="${#lists.isEmpty(sales)}">
                    <td colspan="4" class="text-center">Nenhuma venda registrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
