<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestão de Usuários</h2>
            <a th:href="@{/users/new}" class="btn btn-primary">Novo Usuário</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Email</th>
                    <th>Permissões (Roles)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.username}">User</td>
                    <td th:text="${u.email}">Email</td>
                    <td>
                        <span th:each="role : ${u.roles}" class="badge bg-secondary me-1" th:text="${role.name}">Role</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
