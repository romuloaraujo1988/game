<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Histórico de Vacinação - <span th:text="${animal.earTag}">Brinco</span></h2>
            <div>
                <a th:href="@{/vaccinations/new/{id}(id=${animal.id})}" class="btn btn-primary">Registrar Vacinação</a>
                <a th:href="@{/animals}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Vacina</th>
                    <th>Lote</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${vaccinations}">
                    <td th:text="${v.date}">Data</td>
                    <td th:text="${v.vaccine.name}">Vacina</td>
                    <td th:text="${v.batchNumber}">Lote</td>
                    <td>
                        <a th:href="@{/vaccinations/delete/{id}(id=${v.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir vacinação?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vaccinations)}">
                    <td colspan="4" class="text-center">Nenhuma vacinação registrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
