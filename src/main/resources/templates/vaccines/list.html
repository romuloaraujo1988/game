<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Catálogo de Vacinas</h2>
            <a th:href="@{/vaccines/new}" class="btn btn-primary">Nova Vacina</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Fabricante</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vaccine : ${vaccines}">
                    <td th:text="${vaccine.name}">Nome</td>
                    <td th:text="${vaccine.manufacturer}">Fabricante</td>
                    <td>
                        <a th:href="@{/vaccines/edit/{id}(id=${vaccine.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/vaccines/delete/{id}(id=${vaccine.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vaccines)}">
                    <td colspan="3" class="text-center">Nenhuma vacina cadastrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
