<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <h2 class="mb-4">Registrar Pesagem - <span th:text="${animal.earTag}">Brinco</span></h2>

        <form th:action="@{/weighings/save}" th:object="${weighing}" method="post">
            <input type="hidden" th:field="*{id}" />
            <!-- Bind the animal ID properly -->
            <input type="hidden" name="animal" th:value="${animal.id}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Data da Pesagem</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="weightInKg" class="form-label">Peso (kg)</label>
                    <input type="number" step="0.01" class="form-control" id="weightInKg" th:field="*{weightInKg}" required>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a th:href="@{/weighings/history/{id}(id=${animal.id})}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
