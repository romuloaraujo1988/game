<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Histórico de Peso - <span th:text="${animal.earTag}">Brinco</span></h2>
            <div>
                <a th:href="@{/weighings/new/{id}(id=${animal.id})}" class="btn btn-primary">Nova Pesagem</a>
                <a th:href="@{/animals}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Peso (kg)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="w : ${weighings}">
                    <td th:text="${w.date}">Data</td>
                    <td th:text="${w.weightInKg}">0.0</td>
                    <td>
                        <a th:href="@{/weighings/delete/{id}(id=${w.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Excluir pesagem?');">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(weighings)}">
                    <td colspan="3" class="text-center">Nenhuma pesagem registrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
